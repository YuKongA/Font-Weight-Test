<!DOCTYPE html>
<html lang="en"> <!-- lang 属性必须设为 en, 经测试 zh 下小米设备只能显示 2 字重 -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const t = localStorage.getItem('font-design-theme');
      document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
  </script>
  <meta name="description" content="字体字重测试 - Font Weight Test">
  <link rel="dns-prefetch" href="https://cdn-font.hyperos.mi.com">
  <link rel="preconnect" href="https://cdn-font.hyperos.mi.com" crossorigin>
  <link rel="stylesheet"
    href="https://cdn-font.hyperos.mi.com/font/css?family=MiSans_VF:VF:Chinese_Simplify,Latin&display=swap">
  <title>字体字重测试</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
